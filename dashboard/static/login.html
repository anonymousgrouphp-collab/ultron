<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ULTRON Dashboard</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #070b12; color: #e8edf5; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
    main { width: min(26rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #2a3850; border-radius: 1rem; background: #0e1624; box-shadow: 0 1rem 3rem #0008; }
    h1 { margin: 0 0 .5rem; letter-spacing: .08em; }
    p { color: #abb8ca; line-height: 1.5; }
    label { display: block; margin: 1.5rem 0 .5rem; font-weight: 600; }
    input, button { box-sizing: border-box; width: 100%; border-radius: .5rem; font: inherit; }
    input { padding: .8rem; border: 1px solid #42536c; background: #111c2c; color: inherit; letter-spacing: .3em; text-align: center; }
    button { margin-top: 1rem; padding: .8rem; border: 0; background: #0d6efd; color: #fff; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 1.5rem; margin: 1rem 0 0; color: #ffb4ab; }
    .hint { font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>ULTRON</h1>
    <p>Enter the pairing key shown by the local ULTRON process.</p>
    <form id="login-form">
      <label for="pin">Pairing key</label>
      <input id="pin" name="pin" autocomplete="one-time-code" maxlength="6" pattern="[A-Za-z0-9]{6}" required autofocus>
      <button id="submit" type="submit">Unlock dashboard</button>
    </form>
    <p id="message" role="alert" aria-live="polite"></p>
    <p class="hint">The dashboard is local-only by default. Do not weaken browser security settings to access it.</p>
  </main>
  <script>
    const message = document.getElementById('message');
    const form = document.getElementById('login-form');
    const pin = document.getElementById('pin');
    const submit = document.getElementById('submit');

    function showError(text) {
      message.textContent = text;
      submit.disabled = false;
    }

    function completeLogin(payload, sessionKey) {
      sessionStorage.setItem('ultron_key', payload.key || sessionKey);
      sessionStorage.setItem('ultron_token', payload.token);
      if (payload.device_token) localStorage.setItem('ultron_device_token', payload.device_token);
      window.location.replace('/');
    }

    async function requestLogin(path, body) {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.ok) throw new Error(payload.detail || 'Login was not accepted.');
      completeLogin(payload, body.pin || '');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!/^[A-Za-z0-9]{6}$/.test(pin.value)) return showError('Enter the six-character pairing key.');
      submit.disabled = true;
      message.textContent = '';
      try {
        await requestLogin('/login', { pin: pin.value.toUpperCase() });
      } catch (error) {
        showError(error.message || 'Login could not be completed.');
      }
    });

    (async () => {
      const deviceToken = localStorage.getItem('ultron_device_token');
      if (!deviceToken) return;
      submit.disabled = true;
      try {
        await requestLogin('/api/device-login', { device_token: deviceToken });
      } catch (_) {
        localStorage.removeItem('ultron_device_token');
        submit.disabled = false;
      }
    })();
  </script>
</body>
</html>
