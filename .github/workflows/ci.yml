name: CI

on:
  push:   # all branches — branch-CI-green is the merge gate (PROGRESS.md rule 6); main-only trigger left branch merges ungated
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows runner: ULTRON is Windows-first (pywin32/pycaw/comtypes markers in requirements.txt,
    # and the characterization tests import main/ui which need those + a desktop session).
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # machine finding (PROGRESS.md Findings): 3.13 is the dep-complete line

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests (gating)
        run: |
          python -m pytest tests -v --tb=short 2>&1 | Tee-Object -FilePath pytest_out.txt
          exit $LASTEXITCODE

      - name: Benchmark non-regression gate (P5-A, gating)
        # Roadmap §4 Phase 5 / §6 NSM: the 50-task scripted suite may not
        # drop below the tracked evals/baseline.json (per-subsystem too).
        run: python evals/dashboard.py

      - name: Report failures as annotations (debug — main chat reads these via API)
        if: failure()
        run: |
          if (Test-Path pytest_out.txt) {
            $lines = Get-Content pytest_out.txt
            $hits  = $lines | Select-String -Pattern "FAILED|ERROR|error:|AssertionError|ModuleNotFound|ImportError|E   "
            $hits | Select-Object -First 40 | ForEach-Object {
              $msg = $_.Line.Trim()
              if ($msg.Length -gt 300) { $msg = $msg.Substring(0, 300) }
              Write-Output "::error::$msg"
              Write-Output $msg
            }
            $tail = $lines | Select-Object -Last 30
            $tail | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Ruff (maintained surface, gating)
        run: python -m ruff check kernel tests ULTRON_SETUP.py

      - name: Mypy (kernel, gating)
        run: python -m mypy kernel

      - name: Legacy static debt report (advisory)
        run: python -m ruff check core config memory actions
        continue-on-error: true
